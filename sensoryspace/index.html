<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sensory Space, interactive prototype v9.0</title>

<!--
  ===========================================================================
  SENSORY SPACE, INTERACTIVE PROTOTYPE v9.0
  Torrens University Australia, WIL302B Team T2
  Peter Jopy, A00113261. Information architecture, wayfinding, navigation.

  Conforms to Information Architecture map v9.0.

  HOW TO RUN
  Open this file locally with the assets folder sitting beside it, exactly as
  it comes out of the zip. Nothing is fetched, so file:// works fine.

    interactive-prototype-v9.html
    assets/

  HOW THIS FILE IS ORGANISED
  Every component is one contiguous block: a comment banner, then its CSS,
  then its JS. Global tokens and shared primitives live at the top. This is
  deliberately structured for a port to React or any component framework, so
  each block below maps to one component file.

    00  GLOBAL          tokens, reset, typography, layout primitives
    01  ICONS           the whole SVG set, one family, 24px 1.8 stroke
    02  DATA            zones, applications, feelings, asset manifest
    03  STATE           the store and the render loop
    04  INTRO           entry screen
    05  TOPBAR          persistent chrome, top
    06  PILLBAR         persistent chrome, archway bar
    07  BUBBLE          recommendation speech bubble
    08  FOOTER          persistent chrome, footer
    09  HOME            dashboard screen
    10  ARCHWAY         archway category screen
    11  PLACEHOLDERAPP  the fifteen placeholder application bodies
    12  TOOL            tool screen, canvas plus scaffolding
    13  LIBRARY         proposed component library
    14  OVERLAY         all overlays, shared two column shell
    15  BOOTSTRAP       event delegation and start

  A NOTE ON WHAT IS REAL
  Only the Focus timer works. Everything else inside a canvas is a static
  placeholder. Anything drawn as developer scaffolding is deleted before
  deployment. See the handoff document.
  ===========================================================================
-->

<!-- ═══════════════════════════════════════════════════════════════════════
     00  GLOBAL
     Design tokens, reset, typography and layout primitives.
     Tokens come from Kristine's design system guide. Archway colour is the
     wayfinding system, C6, so it is never hardcoded outside the DATA block.
     ═══════════════════════════════════════════════════════════════════════ -->
<style id="global">
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap');

/* ---- reset ---- */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Poppins',system-ui,sans-serif;background:#2A2727;overflow:hidden}
svg{display:block}
button{font-family:inherit}

/* ---- tokens, light ---- */
#app{
  --bg:#EEEEEE; --surface:#FFFFFF; --line:#DADADA; --line2:#C6C6C6;
  --ink:#484545; --mut:#746E66; --accent:#2063A7;
  --scrim:rgba(238,238,238,.62);
  --pad:28px; --zone:1180px;
  width:100%;height:100%;background:var(--bg);color:var(--ink);
  overflow:hidden;display:flex;flex-direction:column;position:relative}

/* ---- tokens, dark ---- */
#app.dark{--bg:#1C1A1A;--surface:#262323;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);
  --ink:#EEEEEE;--mut:#B1B1B1;--scrim:rgba(28,26,26,.66)}

/* ---- tokens, selectable tone on top of light and dark, Note 1.3 and 1.15 ---- */
#app.tone-warm{--bg:#F6EFE7;--surface:#FFFBF6;--line:#E4D8CA;--line2:#D2C2AE;--ink:#4A403A;--mut:#7A6A5C;--scrim:rgba(246,239,231,.62)}
#app.tone-warm.dark{--bg:#221C18;--surface:#2C2521;--line:rgba(255,240,225,.10);--line2:rgba(255,240,225,.2);--ink:#F2E7DC;--mut:#BCA994;--scrim:rgba(34,28,24,.66)}
#app.tone-cool{--bg:#ECF1F5;--surface:#FBFDFF;--line:#D3DEE7;--line2:#BCCBD7;--ink:#3C464E;--mut:#68757F;--scrim:rgba(236,241,245,.62)}
#app.tone-cool.dark{--bg:#171B1F;--surface:#212730;--line:rgba(225,240,255,.10);--line2:rgba(225,240,255,.2);--ink:#E7EEF4;--mut:#9EAFBC;--scrim:rgba(23,27,31,.66)}

/* ---- reduced motion. Note 1.13, this only reaches the shell and the plate ---- */
#app.norm *{animation:none!important;transition:none!important}

/* ---- typography. Syne headings, Poppins body ---- */
h1,h2,h3,.sechead,.hn,.zhn,.intro h1,.crumb,.backbtn,.pill button,.tname,.btn,.hcta,
.face .fl,.zlab,.grp,.statecard .sn,.resrow,.hl,.slends,.seg span,.bub,.cvfs,.tag,
.libh,.libt,.sslab,.gstep b,.discl b,.rsrow b,.tmr,.pmb b,.hcardex b,.pfname,.sdc h3
  {font-family:'Syne',system-ui,sans-serif}

/* ---- layout primitives ---- */
.wrap{max-width:var(--zone);margin:0 auto;position:relative;z-index:1}
.main{flex:1;padding:28px var(--pad) 150px;overflow:auto;position:relative}
h1.big{font-size:32px;font-weight:700;line-height:1.2;margin-bottom:18px}
.sechead{font-size:24px;font-weight:700;margin:28px 0 14px;line-height:1.22}

/* ---- shared: tag pill. cards only, never a page heading ---- */
.tag{display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:999px;
  font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;white-space:nowrap}
.tag.lt{background:rgba(255,255,255,.92);color:#2B2828}

/* ---- shared: buttons ---- */
.btn{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:999px;
  padding:13px 26px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn svg{width:18px;height:18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;justify-content:center}

/* ---- shared: track, used by sliders and volume ---- */
.trk{flex:1 1 150px;min-width:110px;height:6px;border-radius:999px;background:var(--line2);position:relative}
.trk i{position:absolute;left:0;top:0;bottom:0;width:46%;border-radius:999px;display:block}
.trk b{position:absolute;left:46%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;
  border-radius:50%;background:var(--surface);border:2.5px solid var(--ink);display:block}

/* ---- shared: control bar, the shared control language, Note 1.10 ---- */
.tpal{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);
  background:var(--bg);border-radius:14px;padding:12px 14px;width:100%;max-width:760px}
.tpal .tpg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);letter-spacing:.3px}
.tpal .spacer{margin-left:auto}
.tpb{height:42px;min-width:42px;padding:0 17px;border-radius:999px;border:2px solid var(--line2);
  background:var(--surface);color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Syne',sans-serif}
.tpb svg{width:17px;height:17px}
.tpb.pri{border-color:transparent;color:#fff}

/* ---- responsive. one shell, three breakpoints ---- */
@media(max-width:1100px){
  #app{--pad:20px}
  .hfeel{display:none}
}
@media(max-width:820px){
  h1.big,.subhead h1{font-size:26px}
  .main{padding-bottom:168px}
}
@media(max-width:640px){
  #app{--pad:14px}
}
</style>
</head>

<script id="js-library">

 }
 else if(v==='account'){title='Profile';wide=' wide';
   var left='<div class="reslist">'
    +row(I.user,'Update personal details','Name and how you are addressed','<span class="z">&#8250;</span>')
    +row(I.image,'Select avatar','Pick a character, or upload your own image','<span class="z">&#8250;</span>','data-a="tool" data-z="social" data-t="Avatar creator"')

    +row(I.tone,'Appearance and themes','Light, dark and tone','<span class="z">&#8250;</span>','data-a="ov" data-v="settings"')
    +'</div>';
   h=left;
 }
 else if(v==='settings'){title='Settings';
   h='<div class="grp">Accessibility</div><div class="reslist">'
    +row(I.acc,'Accessibility','Text size, focus, keyboard','<span class="z">&#8250;</span>','data-a="ov" data-v="access"')

    +row(I.tone,'Tone','Selectable palette on top of light and dark, Note 1.3',seg([['Default','default'],['Warm','warm'],['Cool','cool']],st.tone,'settone','t'),'')
    +'</div>'

    +row(I.spark,'How you feel','We recommend where to go, based on it','<span class="z">&#8250;</span>','data-a="ov" data-v="feeling"')
    +'</div>';
 }
 else if(v==='access'){title='Accessibility';
   h='<div class="reslist">'
    +row(I.type,'Text size','Not wired up yet. See the developer to-do list',seg([['A','1'],['A','2'],['A','3']],String(st.ts),'setts','s'),'')
    +row(I.motion,'Reduced motion','Stops animation, and pauses the archway background',tog(st.rm),'data-a="rm"')
    +row(I.focusring,'Visible focus ring','Always show where the keyboard is',tog(true))
    +row(I.skip,'Skip to content','First stop for keyboard and screen reader',tog(true))
    +row(I.keys,'Keyboard shortcuts','The full list','<span class="z">&#8250;</span>')
    +row(I.search,'Search','Not wired up. Lists the four archways only','<span class="z">&#8250;</span>','data-a="ov" data-v="search"')
    +'</div>';
 }
 else if(v==='feeling'){title='How are you feeling';
   h='<p>We will recommend you where to go, depending on how you feel.</p>'
    +'<div class="slwrap"><div class="slfaces">'+S.map(function(s,i){
      return '<button data-a="feel" data-i="'+i+'" style="color:'+(s.c||'var(--ink)')+';opacity:'+(i===st.feel?'1':'.4')+'">'+s.face+'</button>';}).join('')+'</div>'
    +'<input type="range" min="0" max="4" step="1" value="'+st.feel+'" id="sl">'
    +'<div class="slends"><span>Negative</span><span>Positive</span></div></div>'
    +'<div class="statecard" style="border-color:'+(b.c||'var(--line)')+'"><span style="color:'+(b.c||'var(--ink)')+'">'+b.face+'</span>'
    +'<div><div class="sn" style="color:'+(SC(b)||'var(--ink)')+'">'+b.l+'</div><div class="sd">'+b.d+'</div>'
    +(b.z?'<div class="sd">We recommend <b>'+b.t+'</b> in <b>'+Z[b.z].l+'</b>.</div>':'<div class="sd">No archway is recommended.</div>')+'</div></div>';
 }
 else if(v==='about'){title='About the space';
   h='<p>A browser based sensory space for Torrens students. Somewhere to reset for a few minutes between study sessions, then get on with your day.</p>'

 }
 else if(v==='contact'){title='Contact us and feedback';
   h='<div class="field">Your name</div><div class="field">Your message</div><button class="btn" data-a="close">Send</button>';
 }
 else if(v==='privacy'){title='Privacy';
   h='<div class="legal">Placeholder legal copy. Real wording comes from the client.'
    +'<b>What we collect</b>Nothing personal. No account, no server, no tracking.'
    +'<b>What stays on your device</b>Your appearance choices, and only in this browser.'

 else if(v==='terms'){title='Terms';
   h='<div class="legal">Placeholder legal copy. Real wording comes from the client.'
    +'<b>What this is</b>A wellbeing and sensory reset tool. It is not a medical service and not a substitute for one.'
    +'<b>In an emergency</b>Use get support now, or contact emergency services.'
    +'<b>Fair use</b>Be decent to other people in shared spaces.</div>';
 }
 else if(v==='ext'){title='Leaving the space &#8599;';
   h='<p>Helplines opens a vetted crisis support site in a new tab. You are leaving the sensory space.</p><div class="toolbar" style="justify-content:flex-start"><button class="btn" data-a="close">Stay here</button><button class="btn" data-a="close" style="border-color:#8C7400;color:#8C7400">Continue</button></div>';
 }
 else if(v==='toolinfo'){title='Tool status';
   h='<p>This tool is not finalised. What you see is placeholder content. The owner builds the real thing inside the same container, to the style guide and the shared control language, and the library at the bottom of each tool page is the reference.</p><button class="btn" data-a="close">Got it</button>';
 }
 /* the left column is ALWAYS one grid child. without this wrapper, an overlay
    with several top level blocks (settings, search, feeling, about) spills its
    blocks alternately into the avatar column. */
 if(TWOCOL[v]){ h='<div class="pf2"><div class="pfmain">'+h+'</div>'+avatarPanel()+'</div>'; wide=' wide'; }
 var par=PARENT[v];
 var bk=par?'<button class="bk" data-a="ov" data-v="'+par+'" title="Back">'+I.arrow+'</button>':'';
 return '<div class="ovl" data-a="close"><div class="sheet'+wide+'" data-stop="1"><button class="ic x" data-a="close">&#10005;</button>'
  +'<div class="sheethead">'+bk+'<h2>'+title+(sub?'<span class="shsub">'+sub+'</span>':'')+'</h2></div>'+h+'</div></div>';
}

<!-- =======================================================================
     15  BOOTSTRAP
     The render loop, the timer, and one delegated click handler for the whole app.
     data-a is the action, everything else is a parameter. In React this becomes props
     and callbacks, and render() becomes the reconciler doing its job.
     ======================================================================= -->
<style id="css-bootstrap">

 #app{--pad:20px}
 .zcards{grid-template-columns:repeat(2,1fr)}
 .zcard{aspect-ratio:4/3}

 h1.big,.subhead h1{font-size:26px}

}

</style>
<script id="js-bootstrap">
function tick(){
 if(TM.sec>0)TM.sec--;
 else {TM.run=false;clearInterval(TM.iv);TM.iv=null;}
 var el=document.getElementById('tmr');
 if(el)el.textContent=fmt(TM.sec);
 else {clearInterval(TM.iv);TM.iv=null;TM.run=false;}
}
function timerRun(){
 TM.run=!TM.run;
 if(TM.run){ if(TM.sec===0)TM.sec=TM.len; if(!TM.iv)TM.iv=setInterval(tick,1000); }
 else { clearInterval(TM.iv);TM.iv=null; }
}

function armBubble(){
 var w=document.getElementById('bubwrap'),pb=document.getElementById('pillbar'),bu=document.getElementById('bub');
 if(!w||!pb||!bu)return;
 bu.style.maxWidth=Math.max(300,Math.round(pb.getBoundingClientRect().width))+'px';
 if(bubT)clearTimeout(bubT);
 bubT=setTimeout(function(){
   var el=document.getElementById('bub');
   if(el){el.classList.add('out');setTimeout(function(){st.rec=false;render();},300);}
   else {st.rec=false;}
 },6000);
}
function render(){
 if(st.screen==='intro'){
  app.innerHTML='<div class="intro" id="intro"><video data-src="calm" autoplay muted loop playsinline></video><div class="iscrim"></div>'
   +'<div class="ic2"><img class="tlogo" src="'+LOGO+'" alt="Torrens University Australia"><h1>Sensory Space</h1></div></div>';
  document.querySelectorAll('video[data-src]').forEach(function(v){
   var pair=VIDS.calm; v.innerHTML='<source src="'+pair[0]+'" type="video/webm"><source src="'+pair[1]+'" type="video/mp4">'; v.load();
   var pr=v.play(); if(pr&&pr.catch)pr.catch(function(){});
  });
  setTimeout(function(){
   var el=document.getElementById('intro');
   if(el)el.classList.add('fade');
   setTimeout(function(){ st.screen='home'; render(); },900);
  },3000);
  return;
 }
 var b= st.screen==='home'?home():st.screen==='zone'?zone():tool();
 app.innerHTML=topbar()+'<div class="main">'+b+'</div>'+bubble()+pill()+footbar()+overlay();
 app.classList.toggle('toolfs',st.fs&&st.screen==='tool');
 app.classList.toggle('tone-warm',st.tone==='warm');
 app.classList.toggle('tone-cool',st.tone==='cool');
 document.querySelectorAll('video[data-src]').forEach(function(v){
  var pair=VIDS[v.dataset.src]||VIDS.calm;
  v.innerHTML='<source src="'+pair[0]+'" type="video/webm"><source src="'+pair[1]+'" type="video/mp4">'; v.load();
  if(st.rm){ v.addEventListener('loadeddata',function(){v.pause();}); v.pause(); }
  else { var pr=v.play(); if(pr&&pr.catch)pr.catch(function(){}); }
 });
 var sl=document.getElementById('sl');
 if(sl) sl.addEventListener('input',function(){st.feel=+sl.value;st.rec=!!S[st.feel].z;render();});
 if(TM.run&&!TM.iv&&document.getElementById('tmr'))TM.iv=setInterval(tick,1000);
 armBubble();
}
app.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]'); if(!el) return;
 /* clicking inside a sheet must never close the overlay */
 if(el.classList.contains('ovl')&&e.target.closest('[data-stop]')) return;
 var a=el.dataset.a,z=el.dataset.z,t=el.dataset.t,v=el.dataset.v,i=el.dataset.i;
 if(a==='enter'||a==='home'){st.screen='home';st.zone=null;st.tool=null;st.ov=null;st.fs=false;}
 else if(a==='back'){ if(st.screen==='tool'){st.screen='zone';st.tool=null;st.fs=false;} else {st.screen='home';st.zone=null;} st.ov=null; }
 else if(a==='zone'){st.screen='zone';st.zone=z;st.tool=null;st.ov=null;st.fs=false;}
 else if(a==='tool'){st.screen='tool';st.zone=z;st.tool=t;st.ov=null;st.rec=false;}
 else if(a==='feel'){st.feel=+i;st.rec=!!S[st.feel].z;}
 else if(a==='norec'){st.rec=false;}
 else if(a==='fs'){st.fs=!st.fs;}
 else if(a==='ov'){st.ov=v;}
 else if(a==='ext'){st.ov='ext';}
 else if(a==='close'){st.ov=null;}
 else if(a==='dark'){st.dark=!st.dark;}
 else if(a==='setdark'){st.dark=el.dataset.d==='dark';}
 else if(a==='settone'){st.tone=el.dataset.t;}
 else if(a==='setts'){st.ts=+el.dataset.s;}
 else if(a==='rm'){st.rm=!st.rm;}
 else if(a==='setav'){st.av=el.dataset.k;}
 else if(a==='tlen'){TM.len=+el.dataset.s;TM.sec=TM.len;TM.run=false;clearInterval(TM.iv);TM.iv=null;}
 else if(a==='trun'){timerRun();}
 else if(a==='tres'){TM.sec=TM.len;TM.run=false;clearInterval(TM.iv);TM.iv=null;}
 app.classList.toggle('dark',st.dark);
 app.classList.toggle('norm',st.rm);
 render();
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(st.fs){st.fs=false;render();} else if(st.ov){st.ov=null;render();} } });
render();
</script>
